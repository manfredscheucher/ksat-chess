#Kotlin
kotlin.code.style=official
# RAM hygiene for a 16GB Mac: cap the Kotlin daemon so multiple daemons don't OOM.
# scripts/runWeb.sh raises it for the JS link (Compose + solvers), like luckySweep.
kotlin.daemon.jvmargs=-Xmx1536M

#Gradle
# Cap the Gradle daemon too (16GB Mac). Do not raise without reason.
org.gradle.jvmargs=-Xmx1536M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android (only needed because the ksat solver modules apply the Android KMP library plugin)
android.nonTransitiveRClass=true
android.useAndroidX=true

# Project version
version=0.1.0
